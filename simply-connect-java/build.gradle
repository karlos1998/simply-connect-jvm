plugins {
    id "java-library"
    id "maven-publish"
}

description = "Java 17 client for the Simply Connect External API"

dependencies {
    implementation "com.fasterxml.jackson.core:jackson-databind:${rootProject.jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${rootProject.jacksonVersion}"

    testImplementation platform("org.junit:junit-bom:${rootProject.junitVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/karlos1998/simply-connect-jvm")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = "Simply Connect Java"
                description = project.description
                url = "https://github.com/karlos1998/simply-connect-jvm"
                licenses {
                    license {
                        name = "MIT License"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }
                developers {
                    developer {
                        id = "karlos1998"
                        name = "Karol Sojka"
                    }
                }
                scm {
                    url = "https://github.com/karlos1998/simply-connect-jvm"
                    connection = "scm:git:https://github.com/karlos1998/simply-connect-jvm.git"
                }
            }
        }
    }
}
